<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlooyTV - Stremio Addon</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 40px 30px;
    text-align: center;
    max-width: 400px;
    width: 100%;
    backdrop-filter: blur(10px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 1.8rem;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #00d2ff, #3a7bd5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p {
    color: #a0a0c0;
    margin-bottom: 30px;
    font-size: 0.95rem;
    line-height: 1.6;
  }
  .install-btn {
    display: inline-block;
    padding: 16px 40px;
    background: linear-gradient(90deg, #00d2ff, #3a7bd5);
    color: #fff;
    text-decoration: none;
    border-radius: 14px;
    font-size: 1.1rem;
    font-weight: bold;
    transition: 0.3s;
    box-shadow: 0 8px 24px rgba(0,210,255,0.3);
  }
  .install-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(0,210,255,0.5);
  }
  .hint {
    margin-top: 20px;
    font-size: 0.8rem;
    color: #666;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🎬 AlooyTV</h1>
    <p>إضافة Stremio لمشاهدة الأفلام والمسلسلات من AlooyTV</p>
    <a class="install-btn" id="installBtn" href="#">📥 تثبيت في Stremio</a>
    <p class="hint">يفتح تلقائياً في تطبيق Stremio</p>
  </div>

  <script>
    // يبني رابط التثبيت من نفس الدومين الحالي
    const manifestUrl = window.location.origin + '/manifest.json';
    const stremioUrl = 'stremio://' + window.location.host + '/manifest.json';
    document.getElementById('installBtn').href = stremioUrl;
  </script>
</body>
</html>
